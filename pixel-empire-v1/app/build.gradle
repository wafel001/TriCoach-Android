plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pixelempire.clicker'
    compileSdk 36

    defaultConfig {
        applicationId 'com.pixelempire.clicker'
        minSdk 26
        targetSdk 36
        versionCode 411
        versionName '4.1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
