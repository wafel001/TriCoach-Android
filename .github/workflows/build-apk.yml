name: Pixel Empire Unity Android

on:
  push:
    branches: [ gra-unity-v0.4.0 ]
    paths:
      - 'gra-ci/v050/**'
      - 'gra-ci/v052/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unity-android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE" || { echo "::error::Missing UNITY_LICENSE"; exit 1; }
          test -n "$UNITY_EMAIL" || { echo "::error::Missing UNITY_EMAIL"; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo "::error::Missing UNITY_PASSWORD"; exit 1; }

      - name: Reconstruct gameplay source baseline
        run: |
          set -euo pipefail
          rm -rf ci-work /tmp/gra-unity.zip
          mkdir -p ci-work
          cat gra-ci/project90.part* | base64 --decode > /tmp/gra-unity.zip
          unzip -q /tmp/gra-unity.zip -d ci-work
          test -f ci-work/GRA-Unity-v0.4.0/ProjectSettings/ProjectVersion.txt
          grep -q '2022.3.62f2' ci-work/GRA-Unity-v0.4.0/ProjectSettings/ProjectVersion.txt
          unzip -t /tmp/gra-unity.zip >/dev/null
          cd ci-work/GRA-Unity-v0.4.0
          find Assets/Scripts/Gameplay -type f -name '*.cs' -print0 | sort -z | xargs -0 sha256sum > /tmp/gameplay-before.sha256
          cat /tmp/gameplay-before.sha256

      - name: Apply v0.5.2 visual-only rebuild
        run: |
          set -euo pipefail
          python3 gra-ci/v050/apply_v050.py ci-work/GRA-Unity-v0.4.0
          python3 gra-ci/v052/apply_v052.py ci-work/GRA-Unity-v0.4.0
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('ci-work/GRA-Unity-v0.4.0/Packages/manifest.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          deps=data.setdefault('dependencies',{})
          deps['com.unity.modules.jsonserialize']='1.0.0'
          deps['com.unity.modules.physics']='1.0.0'
          p.write_text(json.dumps(data,indent=2)+'\n',encoding='utf-8')
          print('BUILT-IN MODULES: jsonserialize + physics enabled')
          PY
          cd ci-work/GRA-Unity-v0.4.0
          find Assets/Scripts/Gameplay -type f -name '*.cs' -print0 | sort -z | xargs -0 sha256sum > /tmp/gameplay-after.sha256
          diff -u /tmp/gameplay-before.sha256 /tmp/gameplay-after.sha256
          echo 'GAMEPLAY SOURCE PRESERVATION: PASS'
          ! grep -R '\.material\.color' Assets/Scripts/World
          ! grep -q 'Shader.Find' Assets/Scripts/World/VisualMaterialLibrary.cs
          grep -q 'Resources.Load<Material>(BaseMaterialResourcePath)' Assets/Scripts/World/VisualMaterialLibrary.cs
          grep -q '"RenderPipeline"="UniversalPipeline"' Assets/Resources/Shaders/VoxelColor.shader
          grep -q 'Lighting.hlsl' Assets/Resources/Shaders/VoxelColor.shader
          grep -q 'RuntimeFontProvider.Get()' Assets/Scripts/UI/LegacyHudController.cs
          grep -q 'UniversalRenderPipelineAsset' Assets/Editor/ProjectBootstrap.cs
          grep -q 'targetSdkVersion = (AndroidSdkVersions)35' Assets/Editor/ProjectBootstrap.cs
          grep -q 'EnsureVisualMaterialAsset();' Assets/Editor/ProjectBootstrap.cs
          grep -q 'Serialized voxel material does not reference GRA/VoxelColor' Assets/Editor/ProjectBootstrap.cs
          grep -q 'com.unity.render-pipelines.universal' Packages/manifest.json
          grep -q 'com.unity.modules.physics' Packages/manifest.json
          grep -q 'com.unity.modules.jsonserialize' Packages/manifest.json
          cp "$GITHUB_WORKSPACE/gra-ci/v050/gameplay_stress.py" Tools/ci_gameplay_stress.py
          python3 Tools/ci_gameplay_stress.py

      - name: Cache Unity Library v0.5.2
        uses: actions/cache@v4
        with:
          path: ci-work/GRA-Unity-v0.4.0/Library
          key: Library-PixelEmpire-2022.3.62f2-Android-v052-${{ hashFiles('gra-ci/project90.part*', 'gra-ci/v050/**', 'gra-ci/v052/**', '.github/workflows/build-apk.yml') }}
          restore-keys: |
            Library-PixelEmpire-2022.3.62f2-Android-v052-

      - name: Build Android APK in Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ci-work/GRA-Unity-v0.4.0
          unityVersion: 2022.3.62f2
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: GRA.Editor.ProjectBootstrap.BuildAndroid

      - name: Locate APK and verify Android manifest
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find ci-work/GRA-Unity-v0.4.0 -type f -name 'Pixel-Empire-v0.5.2.apk' -print | head -n 1)"
          test -n "$APK" || { echo '::error::Pixel-Empire-v0.5.2.apk not found'; exit 1; }
          cp "$APK" Pixel-Empire-v0.5.2.apk
          unzip -t Pixel-Empire-v0.5.2.apk >/dev/null
          ls -lh Pixel-Empire-v0.5.2.apk
          sha256sum Pixel-Empire-v0.5.2.apk | tee apk-sha256.txt
          AAPT="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name aapt 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$AAPT" ]; then
            echo '::error::aapt not found; cannot verify targetSdkVersion'
            exit 1
          fi
          "$AAPT" dump badging Pixel-Empire-v0.5.2.apk | tee apk-badging.txt
          TARGET="$(sed -n "s/.*targetSdkVersion:'\([0-9][0-9]*\)'.*/\1/p" apk-badging.txt | head -n 1)"
          VERSION="$(sed -n "s/.*versionName='\([^']*\)'.*/\1/p" apk-badging.txt | head -n 1)"
          test -n "$TARGET" || { echo '::error::targetSdkVersion missing from APK'; exit 1; }
          test "$VERSION" = '0.5.2' || { echo "::error::wrong APK version $VERSION"; exit 1; }
          echo "ACTUAL_TARGET_SDK=$TARGET"
          if [ "$TARGET" -lt 35 ]; then
            echo "::error::APK targetSdkVersion $TARGET is too old for Android compatibility gate"
            exit 1
          fi
          echo 'APK INTEGRITY + VERSION + TARGET SDK: PASS'

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Empire-v0.5.2-APK
          path: |
            Pixel-Empire-v0.5.2.apk
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: error

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Empire-v0.5.2-diagnostics
          path: |
            ci-work/GRA-Unity-v0.4.0/Logs
            ci-work/GRA-Unity-v0.4.0/*.log
            /tmp/gameplay-before.sha256
            /tmp/gameplay-after.sha256
            apk-badging.txt
            apk-sha256.txt
          if-no-files-found: ignore
