name: GRA Unity Android APK

on:
  push:
    branches: [ gra-unity-v0.4.0 ]
    paths:
      - 'gra-ci/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unity-android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          test -n "$UNITY_LICENSE" || { echo "::error::Missing UNITY_LICENSE"; exit 1; }
          test -n "$UNITY_EMAIL" || { echo "::error::Missing UNITY_EMAIL"; exit 1; }
          test -n "$UNITY_PASSWORD" || { echo "::error::Missing UNITY_PASSWORD"; exit 1; }

      - name: Reconstruct Unity project
        run: |
          rm -rf ci-work /tmp/gra-unity.zip
          mkdir -p ci-work
          cat gra-ci/project90.part* | base64 --decode > /tmp/gra-unity.zip
          unzip -q /tmp/gra-unity.zip -d ci-work
          test -f ci-work/GRA-Unity-v0.4.0/ProjectSettings/ProjectVersion.txt
          grep -q "2022.3.62f2" ci-work/GRA-Unity-v0.4.0/ProjectSettings/ProjectVersion.txt
          unzip -t /tmp/gra-unity.zip >/dev/null

      - name: Static QA
        working-directory: ci-work/GRA-Unity-v0.4.0
        run: python3 Tools/static_qa.py

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: ci-work/GRA-Unity-v0.4.0/Library
          key: Library-GRA-2022.3.62f2-Android-${{ hashFiles('gra-ci/project90.part*') }}
          restore-keys: |
            Library-GRA-2022.3.62f2-Android-

      - name: Build Android APK in Unity
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ci-work/GRA-Unity-v0.4.0
          unityVersion: 2022.3.62f2
          targetPlatform: Android
          androidExportType: androidPackage
          buildMethod: GRA.Editor.ProjectBootstrap.BuildAndroid

      - name: Verify APK
        run: |
          APK="ci-work/GRA-Unity-v0.4.0/Builds/Android/GRA-Legacy-Parity-v0.4.0.apk"
          test -f "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GRA-Unity-v0.4.0-APK
          path: ci-work/GRA-Unity-v0.4.0/Builds/Android/GRA-Legacy-Parity-v0.4.0.apk
          if-no-files-found: error

      - name: Upload diagnostic files on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: GRA-Unity-v0.4.0-build-diagnostics
          path: |
            ci-work/GRA-Unity-v0.4.0/Logs
            ci-work/GRA-Unity-v0.4.0/*.log
          if-no-files-found: ignore
