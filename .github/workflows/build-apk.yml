name: Build TriCoach 3.0 APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Rebuild TriCoach 3.0 build 31 project
        run: |
          cat payload/v30build31.part* | base64 --decode > tricoach-v3-build31.zip
          echo "a02ae53cdccce2a0fbc3aa2102cae83b0c4ce773e086347d81d73eca6e59a993  tricoach-v3-build31.zip" | sha256sum -c -
          unzip -t tricoach-v3-build31.zip
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q tricoach-v3-build31.zip -d buildsrc
          test -f buildsrc/tricoach_android/settings.gradle

      - name: Build install APK
        working-directory: buildsrc/tricoach_android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        run: cp buildsrc/tricoach_android/app/build/outputs/apk/debug/app-debug.apk TriCoach-v3.0-build31.apk

      - name: Upload install APK
        uses: actions/upload-artifact@v4
        with:
          name: TriCoach-v3.0-build31-APK
          path: TriCoach-v3.0-build31.apk
          if-no-files-found: error
