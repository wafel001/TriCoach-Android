name: Build TriCoach APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0" || true
      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Rebuild TriCoach 2.1 project
        run: |
          cat payload/v2.part* | base64 --decode > tricoach-v2.zip
          unzip -t tricoach-v2.zip
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q tricoach-v2.zip -d buildsrc
          cat payload/v21patch.part00 payload/v21patch.part01 payload/v21patch.part02 payload/v21patch.part03 payload/v21patch.part04 payload/v21patch.part05 payload/v21patch.part06 payload/v21fix.part00 payload/v21fix.part01 payload/v21fix.part02 payload/v21fix.part03 payload/v21fix.part04 payload/v21fix.part05 | base64 --decode > v21-patch.zip
          unzip -oq v21-patch.zip -d buildsrc/TriCoach_Android || true
          cat payload/main2.part00 payload/main2.part01 | base64 --decode | gunzip > buildsrc/TriCoach_Android/app/src/main/java/pl/tricoach/mobile/MainActivity.java
          test -f buildsrc/TriCoach_Android/settings.gradle
          test -s buildsrc/TriCoach_Android/app/src/main/java/pl/tricoach/mobile/MainActivity.java
      - name: Build debug APK
        working-directory: buildsrc/TriCoach_Android
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Rename APK
        run: cp buildsrc/TriCoach_Android/app/build/outputs/apk/debug/app-debug.apk TriCoach-v2.1-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TriCoach-2.1-Android-APK
          path: TriCoach-v2.1-debug.apk
          if-no-files-found: error
