name: Build TriCoach 4.0 APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Rebuild TriCoach 4.0 build 40 project
        run: |
          cat payload/v40build40.part* | base64 --decode > tricoach-v4-build40.zip
          echo "6e2afc70609eefbf8d5ccdb755bab26770bb9d6abc99b39dfffdd749f92fea83  tricoach-v4-build40.zip" | sha256sum -c -
          unzip -t tricoach-v4-build40.zip
          rm -rf buildsrc
          mkdir buildsrc
          unzip -q tricoach-v4-build40.zip -d buildsrc
          test -f buildsrc/tricoach_android/settings.gradle
          grep -q 'versionCode 40' buildsrc/tricoach_android/app/build.gradle
          grep -q 'versionName "4.0"' buildsrc/tricoach_android/app/build.gradle

      - name: Validate web app
        run: |
          python3 - <<'PY'
          import re, pathlib
          p=pathlib.Path('buildsrc/tricoach_android/app/src/main/assets/index.html')
          s=p.read_text()
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          pathlib.Path('/tmp/tricoach4.js').write_text('\n'.join(scripts))
          ids=set(re.findall(r'id=["\']([^"\']+)["\']',s))
          refs=set(re.findall(r'\$\(["\']([^"\']+)["\']\)',s))
          missing=sorted(refs-ids)
          print('ids',len(ids),'js refs',len(refs),'missing',missing)
          if missing: raise SystemExit(1)
          PY
          node --check /tmp/tricoach4.js

      - name: Build install APK
        working-directory: buildsrc/tricoach_android
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Collect APK
        run: cp buildsrc/tricoach_android/app/build/outputs/apk/debug/app-debug.apk TriCoach-v4.0-build40.apk

      - name: Upload install APK
        uses: actions/upload-artifact@v4
        with:
          name: TriCoach-v4.0-build40-APK
          path: TriCoach-v4.0-build40.apk
          if-no-files-found: error
