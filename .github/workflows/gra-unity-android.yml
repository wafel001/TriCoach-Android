name: GRA Unity v0.4.0 Android Gate

on:
  workflow_dispatch:
  push:
    branches: [ gra-unity-v0.4.0 ]
    paths:
      - 'gra-ci/**'
      - 'payload/project.b64.part*'
      - '.github/workflows/gra-unity-android.yml'

permissions:
  contents: read

jobs:
  unity-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct and validate Unity project
        shell: bash
        run: |
          set -euo pipefail
          decode_archive() {
            local pattern="$1" out="$2"
            cat $pattern | base64 --decode > "$out" || return 1
            unzip -tq "$out" >/dev/null 2>&1
          }
          ARCHIVE=/tmp/gra-unity-v0.4.0.zip
          if decode_archive 'gra-ci/project90.part*' "$ARCHIVE"; then
            echo 'Using v0.4.0 90% production archive.'
          elif decode_archive 'payload/project.b64.part*' "$ARCHIVE"; then
            echo 'WARNING: project90 archive incomplete; using last valid Unity archive for compile diagnostics.'
          else
            echo 'No valid Unity project archive found.' >&2
            exit 2
          fi
          rm -rf unity-project
          mkdir unity-project
          unzip -q "$ARCHIVE" -d unity-project
          PROJECT_DIR=$(find unity-project -type f -path '*/ProjectSettings/ProjectVersion.txt' -printf '%h\n' | sed 's#/ProjectSettings$##' | head -n1)
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          cat "$PROJECT_DIR/ProjectSettings/ProjectVersion.txt"
          grep -q '2022.3.62f2' "$PROJECT_DIR/ProjectSettings/ProjectVersion.txt"

      - name: Unity compile and Android build
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ${{ env.PROJECT_DIR }}
          unityVersion: 2022.3.62f2
          targetPlatform: Android
          buildName: GRA-v0.4.0
          buildsPath: build
          allowDirtyBuild: true

      - name: Upload Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: GRA-v0.4.0-Android
          path: build/Android
          if-no-files-found: error
          retention-days: 14
