name: Build GRA Living World APK

on:
  push:
    branches: [gra-apk-build]
    paths:
      - 'payload/gra-apk.*'
      - '.github/workflows/gra-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          cat payload/gra-apk.part00 payload/gra-apk.part01 payload/gra-apk.rem00 payload/gra-apk.rem01 payload/gra-apk.rem02 > gra-apk-project.b64
          base64 -d gra-apk-project.b64 > gra-apk-project.zip
          unzip -q gra-apk-project.zip
          test -f gra-apk/settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: gra-apk
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp gra-apk/app/build/outputs/apk/debug/app-debug.apk GRA-Living-World-v0.2.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GRA-Living-World-v0.2.0-APK
          path: GRA-Living-World-v0.2.0.apk
          if-no-files-found: error
