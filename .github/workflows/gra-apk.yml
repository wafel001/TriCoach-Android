name: Build GRA Verdant Hunt APK

on:
  push:
    branches: [gra-apk-build]
    paths:
      - 'payload/v03.part*'
      - 'payload/gra-game-v0.3.js'
      - '.github/workflows/gra-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Android project
        run: |
          cat payload/v03.part0 payload/v03.part1 payload/v03.part2 payload/v03.part3 payload/v03.part4 > gra-apk-project.b64
          base64 -d gra-apk-project.b64 > gra-apk-project.zip
          unzip -tq gra-apk-project.zip
          unzip -q gra-apk-project.zip
          cp payload/gra-game-v0.3.js gra-apk/app/src/main/assets/game.js
          test -f gra-apk/settings.gradle.kts

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: gra-apk
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare APK
        run: cp gra-apk/app/build/outputs/apk/debug/app-debug.apk GRA-Verdant-Hunt-v0.3.0.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GRA-Verdant-Hunt-v0.3.0-APK
          path: GRA-Verdant-Hunt-v0.3.0.apk
          if-no-files-found: error
