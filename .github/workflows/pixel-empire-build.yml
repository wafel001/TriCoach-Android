name: Pixel Empire 3 Android Build

on:
  push:
    branches:
      - agent/pixel-empire-v3
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
        working-directory: pixel-empire-v1

      - name: Verify APK
        run: |
          test -s pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk
          unzip -t pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk

      - name: Validate v3 content and balance
        run: |
          grep -q 'STAGE_COUNT = 40' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/V3Content.java
          grep -q 'LEVELS_PER_STAGE = 25' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/V3Content.java
          grep -q 'OFFLINE_EFFICIENCY=0.20' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/V3State.java
          grep -q 'OFFLINE_CAP_MS=12L' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/V3State.java
          grep -q 'Math.floor(comboClicks/50.0).*0.1' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/V3View.java
          test "$(grep -c 'new BuildingDef' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/V3Content.java)" -ge 15
          test "$(grep -c 'new HeroDef' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/V3Content.java)" -ge 12
          test "$(grep -c 'new TechDef' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/V3Content.java)" -ge 20

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 interactive smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash pixel-empire-v1/ci/v3-smoke.sh

      - name: Android 9 compatibility smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash pixel-empire-v1/ci/v3-compat.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Empire-v3-diagnostics
          path: |
            pixel-empire-v3-logcat.txt
            pixel-empire-v3-api28-logcat.txt
            pixel-empire-v3-start.png
            pixel-empire-v3-castle.png
            pixel-empire-v3-infinity.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Empire-Clicker-v3.0.0-APK
          path: pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
