name: Pixel Empire Google Play Candidate

on:
  push:
    branches:
      - agent/pixel-empire-release
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK and release AAB
        run: gradle :app:assembleDebug :app:bundleRelease --stacktrace
        working-directory: pixel-empire-v1

      - name: Verify artifacts
        run: |
          test -s pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk
          test -s pixel-empire-v1/app/build/outputs/bundle/release/app-release.aab
          unzip -t pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          unzip -t pixel-empire-v1/app/build/outputs/bundle/release/app-release.aab >/dev/null
          sha256sum pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk
          sha256sum pixel-empire-v1/app/build/outputs/bundle/release/app-release.aab

      - name: Validate release content and balance
        run: |
          grep -q "versionCode 411" pixel-empire-v1/app/build.gradle
          grep -q "versionName '4.1.1'" pixel-empire-v1/app/build.gradle
          grep -q 'STAGES = 40' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/ReleaseContent.java
          grep -q 'LEVELS_PER_STAGE = 25' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/ReleaseContent.java
          grep -q 'OFFLINE_EFFICIENCY = 0.20' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/ReleaseGameState.java
          grep -q 'OFFLINE_CAP_MS = 12L' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/ReleaseGameState.java
          grep -q 'Math.max(0,taps)/50' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/ReleaseGameState.java
          grep -q 'FinalGameView' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/MainActivity.java
          grep -q 'EraFocusView' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/FinalGameView.java
          grep -q 'ScrollableSectionsView' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/FinalGameView.java
          grep -q 'missionScroll' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/ScrollableSectionsView.java
          grep -q 'scroll\[1\]' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/ScrollableSectionsView.java
          test "$(grep -c 'new BuildingDef' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/ReleaseContent.java)" -ge 15
          test "$(grep -c 'new HeroDef' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/ReleaseContent.java)" -ge 12
          test "$(grep -c 'new TechDef' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/ReleaseContent.java)" -ge 20

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 interactive release QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash pixel-empire-v1/ci/release-smoke.sh

      - name: Android 9 compatibility QA
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash pixel-empire-v1/ci/release-compat.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Empire-4.1.1-diagnostics
          path: |
            pixel-empire-release-logcat.txt
            pixel-empire-release-api28-logcat.txt
            pixel-empire-release-start.png
            pixel-empire-release-castle.png
            pixel-empire-release-infinity.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK and AAB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Empire-4.1.1-Google-Play-Candidate
          path: |
            pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk
            pixel-empire-v1/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 7
