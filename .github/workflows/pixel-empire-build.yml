name: Pixel Empire Android Build

on:
  push:
    branches:
      - agent/pixel-empire-v1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
        working-directory: pixel-empire-v1

      - name: Verify APK
        run: |
          test -s pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk
          unzip -t pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk >/dev/null
          sha256sum pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk

      - name: Validate content counts
        run: |
          grep -q 'STAGE_COUNT = 24' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/GameContent.java
          grep -q 'MAX_LEVEL = STAGE_COUNT \* LEVELS_PER_STAGE' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/GameContent.java
          test "$(grep -c 'UpgradeDef(' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/GameContent.java)" -ge 19
          test "$(grep -c 'ResearchDef(' pixel-empire-v1/app/src/main/java/com/pixelempire/clicker/GameContent.java)" -ge 17
          test "$(grep -cE '^[0-9]+\.' pixel-empire-v1/FULL_GAME_CHECKLIST_150.md)" -eq 150

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 15 interactive smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash pixel-empire-v1/ci/smoke.sh

      - name: Android 9 compatibility smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash pixel-empire-v1/ci/compat.sh

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Empire-v2-diagnostics
          path: |
            pixel-empire-logcat.txt
            pixel-empire-api28-logcat.txt
            pixel-empire-v2-home.png
            pixel-empire-v2-infinity.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Empire-Clicker-v2.0.0-APK
          path: pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
