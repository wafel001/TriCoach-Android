name: Pixel Empire Android Build

on:
  push:
    branches:
      - agent/pixel-empire-v1-build
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
        working-directory: pixel-empire-v1

      - name: Verify APK
        run: |
          test -s pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk
          sha256sum pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm || true

      - name: Emulator launch smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb logcat -c
            adb install -r pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk
            adb shell am start -W -n com.pixelempire.clicker/.MainActivity || true
            sleep 8
            adb logcat -d -v brief > pixel-empire-logcat.txt
            PID="$(adb shell pidof com.pixelempire.clicker 2>/dev/null | tr -d '\r' || true)"
            echo "Pixel Empire PID after launch: ${PID:-<none>}"
            if [ -z "$PID" ]; then
              echo "Pixel Empire process exited after launch"
              grep -A 80 -B 20 -E "FATAL EXCEPTION|AndroidRuntime|Process: com.pixelempire.clicker|com.pixelempire.clicker" pixel-empire-logcat.txt || true
              exit 1
            fi
            if grep -E "FATAL EXCEPTION|Process: com.pixelempire.clicker" pixel-empire-logcat.txt; then
              echo "Pixel Empire crashed during smoke test"
              grep -A 80 -B 20 -E "FATAL EXCEPTION|Process: com.pixelempire.clicker" pixel-empire-logcat.txt || true
              exit 1
            fi

      - name: Upload logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Empire-logcat
          path: pixel-empire-logcat.txt
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Pixel-Empire-Clicker-v1.0.1-APK
          path: pixel-empire-v1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
