name: Build TriCoach v3 APK

on:
  push:
    branches: [ v30-build ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android API 36
        run: yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" || true
      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Build v3
        run: bash v30/build-source.sh
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TriCoach-v3-Android-APK
          path: TriCoach-v3.0-test.apk
          if-no-files-found: error
